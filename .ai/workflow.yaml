version: '0.1'

github:
  project: https://github.com/users/lehater/projects/6
  work_item: issue
  hierarchy: sub_issues
  blockers: blocked_by
  result: linked_pull_request
  classification:
    type:
      source: issue_type
      values: [Feature, Task, Bug]
    reasoning:
      source: issue_field
      name: Reasoning
      values:
        Low: Known approach with few design decisions.
        Medium: Requires local analysis or an implementation choice.
        High: Requires architectural decisions or resolving substantial uncertainty.
    effort:
      source: issue_field
      name: Effort
      values:
        Low: Small, localized result.
        Medium: Several related changes.
        High: Substantial volume of work.
      size_equivalents: {S: Low, M: Medium, L: High}
    area:
      source: label
      pattern: '^area:[a-z0-9]+(?:-[a-z0-9]+)*$'

    priority:
      source: project_field
      name: Priority
      values:
        P0: Immediate action to prevent or contain an active critical incident, severe loss, or hard delivery stop.
        P1: High-impact near-term outcome, material risk reduction, or a verified critical-path enabler.
        P2: Valuable planned work without a near-term critical deadline or material blocking impact.
        P3: Low-impact or optional improvement that can safely wait.
      unknown: Leave unassigned and in Preparing until evaluated; never silently default to P2.
    workstream:
      source: project_field
      name: Workstream
    field_verification: Confirm actual Project 6 field names, options, item membership, and Issue Type/Reasoning/Effort availability before use; historical PR configuration is not a live read-back.
  views:
    hierarchy:
      name: Product Structure
      layout: table
      hierarchy: true
      fields: [Parent issue, Sub-issues progress]
    ready_queue:
      name: Ready Queue
      layout: table
      filter: 'repo:lehater/napms-2 is:issue is:open status:Ready'
      fields: [Status, Type, Reasoning, Effort, Labels]

hierarchy:
  levels: [Initiative, Capability or Workstream, Feature, Task]
  allow_skipped_levels: true
  decomposition:
    D1: Give each child a distinct, verifiable result.
    D2: Keep tightly coupled changes in the same executable issue and branch where practical.
    D3: Minimize dependencies and coordination between children.
    D4: Ensure child results cover the parent outcome without duplication.
    D5: Record genuine blockers as GitHub issue dependencies.
    D6: Decompose recursively where needed.
    D7: Stop when the task suits the intended executor, has a verifiable outcome, and further splitting adds little value.
    D8: Keep work together when a safe split is unavailable and route it to a suitable executor.

# Intake, refinement, and ranking take place within the existing Preparing state.
# No additional Project status, agent profile, Skill, or backlog database is required.
refinement:
  flow: [Issue, Intake, Refinement, Decomposition, Prioritization, Task Preparation, Ready]
  intake:
    scope: Coordinator selects a bounded set of candidate Issues and checks open and closed work, prior decisions, and existing parents before proposing a mutation.
    decisions:
      reuse: Continue an existing relevant open Issue; attach evidence and clarify its contract if needed.
      duplicate: Reuse the canonical Issue; propose a native duplicate closure or reference only after checking scope, history, and owner intent.
      historical: Keep accepted completed work closed; reopen only on evidence that the original acceptance is invalid, otherwise propose a distinct follow-up Issue.
      clarify: Keep ambiguous, conflicting, or unverified work in Preparing and request the minimum missing decision or evidence.
      new: Create an Issue only for a distinct outcome not already represented; discover its correct workstream and parent first.
    hierarchy: Use D1-D8 and native Sub-issues only for real outcome decomposition; a Markdown checklist or mention is not a parent relationship.
    dependencies: Use native blocked_by only when one outcome genuinely cannot start or be accepted before another; references and shared context alone are not blockers.
  prioritization:
    meaning: Priority describes relative scheduling importance, not defect severity, task size, or model reasoning demand; parent priority is not inherited.
    evidence: Record affected users or outcome, impact/risk, time sensitivity, actual blockers, relevant owner decisions, and material uncertainty.
    comparison:
      - Compare candidates within the selected Project/workstream and cross-workstream when competing for the same capacity.
      - Compare impact and cost of delay, then urgency or deadline, then verified critical-path unblock value; identify any owner commitments.
      - Use Effort only as an explicit delivery trade-off after value and urgency; use Reasoning to select an executor, never as a priority score.
      - Break remaining ties by prerequisite readiness and a documented owner choice; do not invent a numeric score or silently rank unknown priorities.
    blocked: A high-priority blocked Issue can remain high priority but cannot pass assignment rule R3.
    reassess: On changed impact, deadlines, owner direction, dependency resolution, newly discovered duplicates, or material scope/effort evidence.
    escalate: Escalate disputed cross-workstream trade-offs, ambiguous product value, irreversible product/architecture decisions, missing native fields/options, or authority beyond the approved scope.
  responsibilities:
    coordinator: Select and compare bounded candidates, authorize routine decisions and desired state, serialize conflicting mutations, and escalate owner-level choices.
    refiner: Research with the existing decompose Skill and optional read-only explorer; propose reuse, D1-D8 decomposition, ranking evidence, and executable contracts without claiming persistence.
    project_operator: Apply only authorized GitHub CLI/API mutations and independently read back native fields, relationships, and saved Issue content; this is an I/O responsibility, not a new LLM role.
    worker_reviewer: Keep existing execute-task admission, Worker execution, and independent Reviewer acceptance unchanged.
  desired_state:
    input: Canonical repository/Issue identity, Project 6 item identity, observed Issue update/version and relevant source SHA, approved decisions, evidence, and required GitHub read/write capabilities.
    changes: Ordered create-or-reuse/Issue edits, native Sub-issues and blocked_by links, Issue Type/Reasoning/Effort/Area, Project Priority/Workstream/Status, with expected values and resource identifiers.
    apply: Check current state and permissions first; match existing Issues/links/items by canonical identity; apply only missing approved changes and never duplicate on retry.
    verify: Re-read each touched Issue, Project item/field, native Sub-issue and blocked_by relationship from GitHub; compare actual to expected and report verified IDs and differences. A successful API response is not read-back.
    failure: On stale baseline, partial writes, permission errors, unavailable APIs, or unknown Project options, stop dependent operations, request Preparing (or explicitly deny admission if that write is unavailable), record verified partial state and remaining steps; never assert Ready or invent Markdown-only relationships.
    ready: Advance Preparing to Ready only after the contract passes the existing validator, required classification and Project values are read back, and the native relationship state is verified. Known incomplete dependencies may block later assignment under R3.
  handoff:
    source_of_truth: GitHub Issue, native Project fields/relationships, and linked PR; chat transcripts and model assertions are not authoritative.
    portable_result: Issue/PR URLs and IDs, source version/SHA, adopted decisions, existing execution contract reference, authorized desired-state operations, required runtime capabilities, verified read-back/evidence, unresolved blockers, and one next action.
    storage: Put concise operation/evidence notes in the relevant GitHub Issue or PR; do not copy the YAML execution contract into a second store.
    resume: Re-read GitHub and compare baseline before continuing in another runtime; on missing permissions, tools, context, or model budget, hand off the exact remaining bounded operations without pretending they ran.
  orchestration:
    independent_axes: Role is responsibility; Skill is method; Model is capability/cost; Runtime is execution environment; Capability is verified tools/permissions; Mode is who transfers control.
    human_assisted: A person transfers the same GitHub handoff between ChatGPT, Codex CLI, or another harness; strong or economical models may run in any capable runtime.
    autonomous_future: A harness may eventually transfer the same roles and contracts, but requires explicit owner-approved scope, permission checks, budgets, bounded retries, serialized conflicting mutations, dependency/admission checks, and stop/escalation on unresolved decisions or exhausted quotas.
    enabled: human_assisted_only

lifecycle:
  source: project_status
  field: Status
  initial: Preparing
  states:
    Preparing: Research, decompose, and prepare the contract.
    Ready: The contract is prepared. Dependencies may still block assignment.
    Running: The assigned executor is working in an isolated branch or worktree.
    Review: The result and evidence are available for review and integration.
    Done: The result was accepted, any required changes were integrated, and the issue was closed as completed.
  transitions:
    - from: Preparing
      to: Ready
      when: The executable issue has a valid contract, verified native classification and Project data, and reconciled relationships as required by refinement.desired_state.ready.
    - from: Ready
      to: Running
      when: All execution eligibility rules pass at assignment time.
    - from: Running
      to: Review
      when: The executor links the result and provides verification evidence.
    - from: Review
      to: Done
      when: The acceptance criteria pass, required changes are integrated, and the issue is closed as completed.
    - from: Running
      to: Preparing
      when: An unresolved decision or material contract change requires preparation.
    - from: Review
      to: Running
      when: The executor can fix the implementation within the current contract.
    - from: Review
      to: Preparing
      when: Review identifies a required decision or a material change to the execution contract.
    - from: Ready
      to: Preparing
      when: The contract is stale or a new decision is required.
    - from: Preparing
      to: Done
      when: &planning_parent_accepted A planning-only parent has all required child outcomes accepted, meets its own acceptance criteria, and is closed as completed.
    - from: Running
      to: Done
      when: *planning_parent_accepted
  blocked:
    derived_from: github.blocked_by
    dependency_completion:
      state: closed
      state_reason: completed
    rule: Keep the issue blocked if any listed dependency fails the completion criteria or if the dependency list or a dependency's completion cannot be verified.

execution:
  assignment: manual
  workspace:
    isolation: "Use native Git worktree or Codex-managed worktree when supported; no custom worktree manager, mandatory path, or universal preflight."
    dependencies: "Reuse existing Python/Node dependencies when manifests match; use native symlinks or VS Code worktree configuration if needed. Isolate installations when dependencies differ."
    source: "Makefile points PYTHONPATH at the active checkout src, and NAPMS_PYTHON at the selected interpreter for browser tests."
    cleanup: "Use native git worktree remove only after acceptance and inspection of untracked and ignored artifacts; never force-remove agent-owned work."
  observability:
    backend: "Use existing Codex/Langfuse tracing when configured; no new collector or mandatory gate."
    owner: "The Coordinator or human launcher prepares task identity for any task-scoped Codex session (including refinement), not the Worker Skill after startup."
    setup: "Follow .ai/codex-task-tracing.md in the actual checkout/worktree before Codex launch, or when an Issue is first assigned inside a live session, before the next Stop Hook."
    identity: "One runId (UUID) per execution attempt; reuse across turns/resumed sessions, rotate for a new attempt."
    correlation: "Project-local Langfuse metadata includes repository, primary issueId, runId, and initial sourceSha; Codex supplies sessionId and traceId."
    evidence: "Record runId and initial sourceSha plus known session/trace references in existing Issue/PR handoff; GitHub/CI/Review remain outcome authority."
    isolation: "Keep per-worktree .codex/langfuse.json untracked; do not commit credentials or reuse stale task metadata."
  require_all:
    R1: The issue is open and its Project Status is Ready.
    R2: The issue contains a sufficient execution contract.
    R3: The issue is unblocked according to lifecycle.blocked.
    R4: The context and contract still match the current project state.
    R5: The chosen executor has the required tools and reasoning capability.
    R6: No other executor is working on the issue.
    R7: Work can begin without resolving substantial unknowns.
