function attachPanZoom(svg){let el=$("diagram"),down=null;el.addEventListener('pointerdown',e=>{if(e.target.closest('.node'))return;down={x:e.clientX,y:e.clientY,z:{...S.zoom}};el.setPointerCapture(e.pointerId)});el.addEventListener('pointermove',e=>{if(!down)return;let r=el.getBoundingClientRect();let dx=(e.clientX-down.x)/r.width*down.z.w,dy=(e.clientY-down.y)/r.height*down.z.h;S.zoom.x=down.z.x-dx;S.zoom.y=down.z.y-dy;el.setAttribute('viewBox',`${S.zoom.x} ${S.zoom.y} ${S.zoom.w} ${S.zoom.h}`)});el.addEventListener('pointerup',()=>down=null);el.addEventListener('wheel',e=>{e.preventDefault();let r=el.getBoundingClientRect(),cx=(e.clientX-r.left)/r.width,cy=(e.clientY-r.top)/r.height;zoomAt(e.deltaY<0?.9:1.1,cx,cy)},{passive:false})}
['layerExec','layerData','layerBinding','layerLimits'].forEach(id=>$(id).onchange=()=>{if(S.view==='functional')renderFunctional()});function capTextBrief(name){return name.replace(/^C\d+\s*/,'')}
