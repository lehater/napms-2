[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "napms"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "pydantic>=2.10,<3", "uvicorn>=0.34,<1"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.28,<1"]
quality = ["ruff==0.17.4", "pyright==1.1.414", "pytest-cov==7.1.0"]

[project.scripts]
napms-dev = "napms.dev:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py312"

[tool.pyright]
include = ["src", "tests"]
extraPaths = ["src"]
pythonVersion = "3.12"
typeCheckingMode = "basic"
