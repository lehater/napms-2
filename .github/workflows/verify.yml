name: Verify

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: verify-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  changes:
    name: changes
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      docs-only: ${{ steps.scope.outputs.docs-only }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Classify the changes in the tested merge commit
        id: scope
        run: |
          git rev-parse --verify HEAD^2 >/dev/null
          python3 - <<'PY'
          import os
          import re
          import subprocess

          # Disabling rename detection includes both paths when a file moves.
          changed = subprocess.check_output(
              ["git", "diff", "--name-only", "--no-renames", "-z", "HEAD^1", "HEAD", "--"]
          ).split(b"\0")[:-1]
          documentation = re.compile(
              rb"(?:README\.md|(?:docs|openspec/(?:changes|specs))/.+\.md"
              rb"|openspec/changes/(?:[^/]+/)+\.openspec\.yaml)"
          )
          docs_only = bool(changed) and all(documentation.fullmatch(path) for path in changed)
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              print(f"docs-only={str(docs_only).lower()}", file=output)
          PY
  application:
    name: application
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.docs-only != 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install application, test and quality dependencies
        run: python -m pip install -e '.[test,quality]'
      - name: Test application, HTTP contracts and local startup with coverage
        run: python -m pytest -q --cov=napms --cov-report=term-missing
      - name: Ruff core diagnostics (blocking)
        id: ruff_core
        run: python -m ruff check --select E4,E7,E9,F src tests
      - name: Ruff extended lint (advisory baseline)
        id: ruff_extended
        continue-on-error: true
        run: python -m ruff check src tests
      - name: Ruff formatting (advisory baseline)
        id: ruff_format
        continue-on-error: true
        run: python -m ruff format --check src tests
      - name: Pyright typing (advisory baseline)
        id: pyright
        continue-on-error: true
        run: python -m pyright
      - name: Summarize check outcomes
        if: always()
        run: |
          echo '### SDLC-01 quality checks' >> "$GITHUB_STEP_SUMMARY"
          echo '| Check | Gate | Outcome |' >> "$GITHUB_STEP_SUMMARY"
          echo '| --- | --- | --- |' >> "$GITHUB_STEP_SUMMARY"
          echo '| Ruff core (E4,E7,E9,F) | blocking | ${{ steps.ruff_core.outcome }} |' >> "$GITHUB_STEP_SUMMARY"
          echo '| Ruff extended | advisory | ${{ steps.ruff_extended.outcome }} |' >> "$GITHUB_STEP_SUMMARY"
          echo '| Ruff format | advisory | ${{ steps.ruff_format.outcome }} |' >> "$GITHUB_STEP_SUMMARY"
          echo '| Pyright | advisory | ${{ steps.pyright.outcome }} |' >> "$GITHUB_STEP_SUMMARY"
          echo 'Advisory failures do not fail the job; inspect their logs for counts.' >> "$GITHUB_STEP_SUMMARY"
  validate:
    name: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Check bootstrap structure
        run: |
          test -s README.md
          test -s AGENTS.md
          test -f openspec/config.yaml
          test -f .agents/skills/openspec-propose/SKILL.md
      - name: Install OpenSpec
        run: npm install --global @fission-ai/openspec@1.16.0
      - name: Validate OpenSpec
        run: |
          openspec list --json
          openspec validate --all --strict
  semantic-contract:
    name: semantic-contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Enforce the accepted UX-0 semantic boundary contract
        working-directory: web
        run: npm run test:semantic
  web:
    name: web
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.docs-only != 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install real backend
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -e .
      - name: Install web dependencies
        working-directory: web
        run: npm ci
      - name: Typecheck and production build
        working-directory: web
        run: npm run build
      - name: Install Chromium and system dependencies
        working-directory: web
        run: npx playwright install --with-deps chromium
      - name: Real FastAPI and SQLite browser tests
        working-directory: web
        run: npm run test:e2e
